<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>For Saraansh ❤️</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap');

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#080107;color:#fff;min-height:100%;font-family:Montserrat,sans-serif}
body{overflow-x:hidden}
.page{min-height:100vh;display:none;position:relative;padding:70px 22px 45px;overflow:hidden;background:
radial-gradient(circle at 50% 45%,rgba(104,0,34,.28),transparent 38%),
linear-gradient(145deg,#090107,#16020d 48%,#070106)}
.page.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float-heart{position:absolute;color:#ff164f;opacity:.25;font-size:13px;animation:float 9s linear infinite}
@keyframes float{0%{transform:translateY(110vh) scale(.7);opacity:0}15%{opacity:.25}85%{opacity:.22}100%{transform:translateY(-15vh) scale(1.15);opacity:0}}
.content{position:relative;z-index:2;width:100%;max-width:720px;text-align:center}
.topbar{position:absolute;top:20px;left:18px;right:18px;display:flex;justify-content:space-between;z-index:4}
.pill{border:1px solid #8d0b35;color:#fff;background:rgba(15,0,9,.55);padding:12px 18px;border-radius:30px;font-size:12px;letter-spacing:3px;font-weight:600}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",serif}
.script{font-family:Parisienne,cursive}
.kicker{font-size:12px;letter-spacing:6px;color:#ff7297;margin-bottom:18px}
h1{font-size:clamp(48px,12vw,88px);line-height:.92;margin:10px 0;font-weight:600}
h1 .pink,h2 .pink{color:#ff315e;text-shadow:0 0 24px rgba(255,30,84,.55)}
.subtitle{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:26px;color:#f4e9eb}
button,.btn{border:1px solid #ff174b;background:#f20c3d;color:#fff;border-radius:40px;padding:16px 30px;font-weight:700;letter-spacing:3px;cursor:pointer;box-shadow:0 0 28px rgba(255,15,65,.32);font-size:13px}
button.ghost{background:transparent;border-color:#8d0b35;box-shadow:none}
button:active{transform:scale(.97)}
.photo-hero{width:min(330px,80vw);height:390px;object-fit:cover;border-radius:50% 50% 48% 48%;border:5px solid rgba(255,44,94,.25);box-shadow:0 0 35px rgba(255,18,78,.38);margin:15px auto 28px}
.heart-big{font-size:130px;line-height:1;filter:drop-shadow(0 0 25px #ff174b);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.choices{display:grid;gap:14px;margin:30px auto;max-width:560px}
.choice{padding:20px;border:1px solid #7d0a30;border-radius:18px;background:rgba(47,0,19,.45);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;cursor:pointer;transition:.25s}
.choice:hover{border-color:#ff3767;box-shadow:0 0 25px rgba(255,20,80,.15);transform:translateY(-2px)}
#choiceReply{min-height:45px;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:25px;color:#ffb4c5}
.letter-wrap{perspective:1000px;margin:25px auto;width:min(620px,92vw)}
.letter{background:#fbf0dc;color:#402a2a;border-radius:24px;padding:34px 28px;text-align:left;line-height:1.8;font-family:"Cormorant Garamond",serif;font-size:20px;box-shadow:0 0 35px rgba(255,40,90,.2);max-height:62vh;overflow:auto}
.letter p{margin:0 0 18px}
.gallery-card{background:#f7eef0;padding:12px 12px 48px;width:min(430px,88vw);margin:25px auto;transform:rotate(-2deg);box-shadow:0 20px 50px rgba(0,0,0,.5);color:#222}
.gallery-card img{width:100%;height:min(62vh,520px);object-fit:cover;display:block}
.gallery-caption{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:20px;margin-top:12px}
.navrow{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:18px}
.navrow button{padding:12px 20px;font-size:11px}
.counter{color:#d7aeb8;font-size:13px}
.envelope{width:280px;height:190px;background:#f4dfbf;margin:35px auto;border-radius:12px;position:relative;cursor:pointer;box-shadow:0 20px 50px rgba(255,20,70,.18)}
.envelope:before{content:"";position:absolute;left:0;top:0;border-left:140px solid transparent;border-right:140px solid transparent;border-top:95px solid #e6cda9;transform-origin:top;transition:.7s;z-index:3}
.envelope.open:before{transform:rotateX(180deg)}
.envelope:after{content:"❤️";position:absolute;left:50%;top:65px;transform:translateX(-50%);font-size:34px;z-index:4}
.envelope span{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);color:#8b4560;font-family:"Cormorant Garamond",serif;font-size:18px;white-space:nowrap}
.video-box{width:min(650px,92vw);aspect-ratio:16/9;border:1px solid #6d0a2c;border-radius:20px;background:#16040e;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 35px rgba(255,0,60,.12)}
.video-box video{width:100%;height:100%;object-fit:cover}
.note{color:#b9949f;font-size:12px;line-height:1.6;margin:12px auto;max-width:600px}
.final-heart{font-size:170px;filter:drop-shadow(0 0 45px #ff174b);animation:pulse 1.5s infinite}
.footer{margin-top:30px;color:#6f4653;font-size:11px;letter-spacing:2px}
.music-box{border:1px solid #6f0a2e;border-radius:22px;padding:24px;background:rgba(35,0,15,.55);max-width:560px;margin:25px auto}
.music-title{font-family:"Cormorant Garamond",serif;font-size:28px}
a.song{display:inline-block;margin-top:18px;color:#fff;text-decoration:none}
@media(max-width:480px){
  .page{padding-top:75px}
  .subtitle{font-size:23px}
  .letter{font-size:18px}
  .photo-hero{height:330px}
}

.page{display:flex;min-height:100vh}

.music-player{position:fixed;right:16px;bottom:16px;z-index:9999;background:rgba(25,0,12,.92);
border:1px solid #8d0b35;color:#fff;border-radius:30px;padding:9px 14px;font:600 11px Montserrat,sans-serif;
letter-spacing:1px;box-shadow:0 0 22px rgba(255,20,80,.22);cursor:pointer}
</style></head><body><div class="hearts" id="hearts"></div>
<section class="page active"><div class="content">
<div class="kicker">HAPPY BOYFRIEND'S DAY ❤️</div>
<h1 style="font-size:clamp(52px,14vw,100px)">Happy<br><span class="pink">Boyfriend's</span><br>Day</h1>
<div class="script" style="font-size:48px;color:#ff9ab0">Gugglluuuu ♡</div>
<div class="final-heart">❤️</div>
<h2 class="subtitle">Some moments become memories.<br>Some memories become forever.<br><span class="pink">And you became my forever.</span></h2>
<p class="footer">MADE WITH ALL MY LOVE — LEHAR ❤️</p>
</div></section><script>
const box=document.getElementById('hearts');
for(let i=0;i<42;i++){const h=document.createElement('span');h.className='float-heart';h.textContent='♥';h.style.left=Math.random()*100+'%';h.style.animationDelay=(-Math.random()*9)+'s';h.style.animationDuration=(7+Math.random()*8)+'s';h.style.fontSize=(8+Math.random()*12)+'px';box.appendChild(h)}
</script>
<div class="music-player" onclick="toggleMusic()" id="musicBtn">♫ MUSIC ON</div>
<audio id="bgMusic" preload="auto" loop>
  <source src="assets/music/alfaz-bg.mp3" type="audio/mpeg">
</audio>
<script>
const bgMusic=document.getElementById('bgMusic'), musicBtn=document.getElementById('musicBtn');
bgMusic.volume=.38;
const START_AT=84; // 1:24
function getSavedTime(){
  const saved=Number(localStorage.getItem('alfazMusicTime'));
  return Number.isFinite(saved) && saved>=START_AT ? saved : START_AT;
}
function startMusic(){
  try { bgMusic.currentTime=getSavedTime(); } catch(e) {}
  bgMusic.play().then(()=>{
    localStorage.setItem('alfazMusicEnabled','true');
    musicBtn.textContent='♫ MUSIC ON';
  }).catch(()=>{ musicBtn.textContent='♫ TAP FOR MUSIC'; });
}
function toggleMusic(){
  if(bgMusic.paused){ startMusic(); }
  else { bgMusic.pause(); musicBtn.textContent='♫ MUSIC OFF'; localStorage.setItem('alfazMusicEnabled','false'); }
}
bgMusic.addEventListener('timeupdate',()=>{
  if(!bgMusic.paused) localStorage.setItem('alfazMusicTime',String(bgMusic.currentTime));
});
bgMusic.addEventListener('ended',()=>{
  // The supplied clip ends at 1:41. Keep the requested 1:24→end section going.
  localStorage.setItem('alfazMusicTime',String(START_AT));
  if(localStorage.getItem('alfazMusicEnabled')!=='false') startMusic();
});
window.addEventListener('load',()=>{
  if(localStorage.getItem('alfazMusicEnabled')!=='false') startMusic();
});
</script>
</body></html>
